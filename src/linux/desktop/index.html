<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LanChat</title>
  <link rel="stylesheet" href="desktop.css">
  <script src="presentation.js" defer></script>
  <script src="scrollbar.js" defer></script>
  <script src="overlay.js" defer></script>
  <script src="renderer.js" defer></script>
</head>
<body>
  <aside aria-label="会话">
    <div class="toolbar">
      <div class="search">
        <img src="assets/Search.png" alt="">
        <input id="search" type="search" placeholder="搜索会话" aria-label="搜索会话">
        <button id="search-clear" type="button" hidden aria-label="清除搜索内容">×</button>
      </div>
      <button id="refresh" class="icon" type="button" title="刷新节点" aria-label="刷新节点"><img src="assets/Refresh.png" alt=""></button>
    </div>
    <div class="profile">
      <img src="assets/avatar.png" alt="">
      <strong id="nickname">LanChat</strong>
    </div>
    <div class="scroll-host sessions">
      <nav id="chats" class="scroll-view" aria-label="会话列表"></nav>
    </div>
    <div class="sidebar-bottom">
      <button id="open-settings" class="user-chip" type="button" disabled aria-label="设置"><span id="nickname-chip">?</span></button>
      <button id="quit" class="quit" type="button"><img src="assets/Logout.png" alt="">退出 LanChat</button>
    </div>
  </aside>
  <main id="conversation">
    <header class="chat-header">
      <div class="identity">
        <img id="avatar" src="assets/group.png" alt="">
        <div>
          <h1 id="title">局域网全员群聊</h1>
          <p id="connection" class="secondary">正在连接通信服务…</p>
        </div>
      </div>
    </header>
    <div class="scroll-host feed">
      <section id="messages" class="scroll-view" tabindex="0" aria-label="聊天记录"></section>
    </div>
    <div class="scroll-host transfers-host" hidden>
      <div id="transfers" class="scroll-view secondary" aria-label="本会话文件传输" aria-live="polite"></div>
    </div>
    <div id="status" class="status" role="status"></div>
    <form id="compose" class="compose">
      <button id="attach" class="icon attach" type="button" title="附件与快捷操作 (点击打开菜单)" aria-label="附件与快捷操作" disabled><img src="assets/Add.png" alt=""></button>
      <div class="scroll-host compose-scroll">
        <textarea id="message" class="scroll-view" maxlength="32768" rows="1" placeholder="给 局域网全员群聊 发消息" aria-label="消息" disabled></textarea>
      </div>
      <button id="send" class="icon send" title="发送消息" aria-label="发送消息" disabled><img src="assets/UpArrow.png" alt=""></button>
    </form>
  </main>
  <div id="menu" role="menu" hidden></div>
  <div id="emoji" role="dialog" aria-label="插入 Emoji 表情" aria-modal="true" hidden></div>
  <dialog id="recipient">
    <form method="dialog">
      <h2>选择接收节点</h2>
      <div class="scroll-host recipients-host">
        <div id="recipients" class="scroll-view"></div>
      </div>
      <button id="recipient-cancel" value="" class="pill">取消</button>
    </form>
  </dialog>
  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="settings-actions">
        <button id="confirm-cancel" class="pill" value="cancel">取消</button>
        <button id="confirm-accept" class="pill danger" value="ok">确定</button>
      </div>
    </form>
  </dialog>
  <dialog id="settings" aria-labelledby="settings-title">
    <form id="settings-form" method="dialog">
      <h2 id="settings-title">设置</h2>
      <label>昵称 <input id="settings-nickname" maxlength="80" required></label>
      <label><input id="settings-auto-accept" type="checkbox"> 自动接收文件</label>
      <div>
        <button id="settings-pick-directory" class="pill" type="button">更改接收目录</button>
        <p class="settings-path secondary" id="settings-directory"></p>
      </div>
      <div>
        <button id="settings-pick-history" class="pill" type="button">迁移聊天记录</button>
        <p class="settings-path secondary" id="settings-history"></p>
      </div>
      <p class="settings-path secondary" id="settings-message" role="status" hidden></p>
      <div class="settings-actions">
        <button id="settings-cancel" class="pill" type="button">取消</button>
        <button id="settings-save" class="pill" type="submit">保存</button>
      </div>
    </form>
  </dialog>
</body>
</html>

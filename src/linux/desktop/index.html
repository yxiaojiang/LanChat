<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LanChat</title>
  <link rel="stylesheet" href="desktop.css">
  <script src="appearance.js" defer></script>
  <script src="presentation.js" defer></script>
  <script src="scrollbar.js" defer></script>
  <script src="overlay.js" defer></script>
  <script src="session-sidebar.js" defer></script>
  <script src="conversation-view.js" defer></script>
  <script src="composer-box.js" defer></script>
  <script src="renderer.js" defer></script>
</head>
<body>
  <aside aria-label="会话">
    <div class="toolbar">
      <div class="search">
        <img src="assets/Search.png" alt="">
        <input id="search" type="search" placeholder="搜索会话" aria-label="搜索会话">
        <button id="search-clear" type="button" hidden aria-label="清除搜索内容">×</button>
      </div>
    </div>
    <div class="profile">
      <img src="assets/avatar.png" alt="">
      <strong id="nickname">LanChat</strong>
    </div>
    <div class="scroll-host sessions">
      <nav id="chats" class="scroll-view" aria-label="会话列表"></nav>
    </div>
    <div class="sidebar-bottom">
      <button id="open-settings" class="user-chip" type="button" disabled aria-label="设置"><span id="nickname-chip">?</span></button>
      <button id="quit" class="quit" type="button"><img src="assets/Logout.png" alt="">退出 LanChat</button>
      <button id="refresh" class="icon" type="button" title="刷新好友列表" aria-label="刷新好友列表"><img src="assets/Refresh.png" alt=""></button>
    </div>
  </aside>
  <main id="conversation">
    <header class="chat-header">
      <div class="identity">
        <img id="avatar" src="assets/group.png" alt="">
        <div>
          <h1 id="title">局域网全员群聊</h1>
          <p id="connection" class="secondary">正在连接通信服务…</p>
        </div>
      </div>
    </header>
    <div class="scroll-host feed">
      <section id="messages" class="scroll-view" tabindex="0" aria-label="聊天记录"></section>
    </div>
    <div id="status" class="status" role="status"></div>
    <div id="attachments-host" class="scroll-host attachments-host" hidden>
      <div id="attachments" class="scroll-view" aria-label="待发送附件"></div>
    </div>
    <form id="compose" class="compose">
      <div class="scroll-host compose-scroll">
        <textarea id="message" class="scroll-view" maxlength="32768" rows="1" placeholder="给 局域网全员群聊 发消息" aria-label="消息" disabled></textarea>
        <div id="message-rich" class="scroll-view composer-rich" contenteditable="true" role="textbox" aria-multiline="true"
             aria-label="消息" data-composer-input="true" data-max-length="32768" hidden></div>
      </div>
      <div class="compose-tools" aria-label="快捷工具">
        <button id="attach" class="icon tool" type="button" title="插入表情" aria-label="插入表情" disabled><img src="assets/Emoji.png" alt=""></button>
        <button id="open-downloads" class="icon tool" type="button" title="打开接收目录" aria-label="打开接收目录" disabled><img src="assets/Folder.png" alt=""></button>
        <button id="send-file" class="icon tool" type="button" title="选择文件" aria-label="选择文件" disabled><img src="assets/Folder.png" alt=""></button>
        <button id="take-screenshot" class="icon tool" type="button" title="屏幕截图" aria-label="屏幕截图" disabled><img src="assets/Scissors.png" alt=""></button>
        <button id="clear-chat" class="icon tool" type="button" title="清空当前对话" aria-label="清空当前对话" disabled><img src="assets/ClearDanger.png" alt=""></button>
      </div>
      <button id="send" class="icon send" title="发送消息" aria-label="发送消息" disabled><img src="assets/UpArrow.png" alt=""></button>
    </form>
  </main>
  <div id="menu" role="menu" hidden></div>
  <div id="emoji" class="scroll-host" role="dialog" aria-label="插入 Emoji 表情" aria-modal="true" hidden>
    <div id="emoji-grid" class="scroll-view"></div>
  </div>
  <dialog id="recipient">
    <form method="dialog">
      <h2>选择接收节点</h2>
      <div class="scroll-host recipients-host">
        <div id="recipients" class="scroll-view"></div>
      </div>
      <button id="recipient-confirm" type="button" class="pill" hidden>发送到选中节点</button>
      <button id="recipient-cancel" value="" class="pill">取消</button>
    </form>
  </dialog>
  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="settings-actions">
        <button id="confirm-cancel" class="pill" value="cancel">取消</button>
        <button id="confirm-accept" class="pill danger" value="ok">确定</button>
      </div>
    </form>
  </dialog>
</body>
</html>
